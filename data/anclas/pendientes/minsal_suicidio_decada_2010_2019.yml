# Anclas de evidencia — Informe de Mortalidad por Suicidio en Chile: 2010-2019 (MINSAL).
# Esquema en docs/05-CALIDAD.md#anclas-evidencia. Extraídas 2026-08-03.
#
# Todas DURAS: el DEIS es coautor del informe y la fuente del numerador es su propio
# registro de defunciones. No hay cadena que seguir hacia atrás.
#
# LO QUE HACE FALTA MIRAR ANTES DE COMPARAR CUALQUIERA DE ESTAS:
#   - excluyen a los menores de 5 años, del numerador Y del denominador;
#   - las tasas son por 100.000 habitantes DE 5 AÑOS Y MÁS, no sobre población total;
#   - la estandarización usa como referencia la población INE proyectada para 2002.
# Tres decisiones que ningún otro emisor de este catálogo repite.

