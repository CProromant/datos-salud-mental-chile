# Anclas de evidencia — Mental Health ATLAS 2020, perfil de Chile (OMS).
# Esquema en docs/05-CALIDAD.md#anclas-evidencia. Extraídas 2026-08-03.
#
# TODAS BLANDAS. La OMS publica pero no produce: las cifras de recursos las reporta cada
# Estado por cuestionario, y el cuestionario que respondió Chile no es público. Por eso
# casi todas quedan `cadena_incompleta`. Las marcadas "WHO official estimates" son
# distintas: las modela la propia OMS a partir de registros vitales, así que la OMS sí es
# el origen del número aunque no del dato subyacente.
#
# El PDF es de formulario y la extracción de texto devuelve valores SIN sus etiquetas,
# en orden de dibujo. Todas se confirmaron renderizando la página; ninguna se tomó del
# texto extraído.

version: 1
documento_id: who_mhatlas_2020_chile

anclas:

  # ---- Carga y mortalidad: estimaciones propias de la OMS ----

  - id: who_tasa_suicidio_estandarizada_2019
    valor: "8.04"
    valor_num: 8.04
    unidad: por_100000
    metrica: "Tasa de mortalidad por suicidio estandarizada por edad"
    periodo: "2019"
    ambito: nacional
    definicion_textual: >-
      "Age-standardized suicide mortality rate (per 100 000 population)", bajo el
      encabezado "Burden of mental disorders (WHO official estimates)". El documento no
      declara en esta página la población estándar usada ni el rango etario incluido.
    denominador:
      fuente: "No declarado en el documento. Población total (UN official estimate) 18 952 035 aparece en la misma página"
    documento_id: who_mhatlas_2020_chile
    sha256: "33777c83417bae950057278beabed77ca7c259ece321ebf9e95b291441e04076"
    pagina: 1
    ubicacion: "Bloque 'Burden of mental disorders', y Figura 'Age-standardized suicide mortality rate per 100 000 population, 2013, 2016 and 2019'"
    fecha_consulta: "2026-08-03"
    clase: blanda
    estado: verificada
    metodo_lectura: pagina_renderizada
    en_conflicto: [suicidio_tasa_estandarizada_2019]
    nota: >
      CONFLICTO con `suicidio_tasa_estandarizada_2019` (MINSAL, 9,78 para el mismo año,
      mismo país, misma métrica declarada). No se resuelve acá. Las dos diferencias
      documentadas que podrían explicarlo: el MINSAL estandariza contra la población INE
      proyectada 2002 y calcula sobre población de 5 años y más; este documento no
      declara ninguna de las dos cosas. Registrar ambas es el punto.

