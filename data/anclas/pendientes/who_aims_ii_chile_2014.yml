  - id: aims_distribucion_presupuesto_2012_hosp_psiquiatrico
    valor: "16%"
    valor_num: 16
    unidad: porcentaje
    metrica: "Participación de «hosp. psiquiátrico» en el presupuesto de salud mental"
    periodo: "2012"
    ambito: nacional
    definicion_textual: >-
      «Distribución porcentual del presupuesto de salud mental del año 2012 entre los
      distintos componentes de la red», categoría «hosp. psiquiátrico». El texto que acompaña la
      figura declara que atención ambulatoria de especialidad, alcohol y drogas, y
      trastornos mentales en APS suman en conjunto el 70 % del presupuesto de salud
      mental, y que los hospitales psiquiátricos fueron el 16 %.
    denominador:
      descripcion: "Presupuesto de salud mental del sistema público, año 2012"
