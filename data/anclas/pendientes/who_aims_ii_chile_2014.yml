# Anclas de evidencia — Informe WHO-AIMS sobre el Sistema de Salud Mental en Chile
# (segundo informe, 2014). MINSAL / OMS.
# Esquema en docs/05-CALIDAD.md#anclas-evidencia. Extraídas 2026-08-03.
#
# DURAS: el presupuesto de salud mental del sistema público chileno lo publica acá el
# propio MINSAL, que es quien lo ejecuta. No hay cadena que seguir hacia atrás.
#
# POR QUÉ IMPORTAN PARA I-07. El proyecto midió que solo el 0,05 % de la partida 16 lleva
# glosa de salud mental y concluyó —con razón— que el presupuesto no permite aislar el
# gasto en salud mental desde el clasificador presupuestario. Estas cifras NO contradicen
# eso: son una construcción interna del MINSAL, hecha con criterios que este documento no
# publica, no una partida rastreable en DIPRES. Lo que aportan es que el propio ministerio
# sí produce una cifra, que es distinto de que la cifra sea reconstruible desde afuera.
# Cuál de las dos cosas necesita I-07 es una decisión abierta.
#
# OJO CON LA PÁGINA: la impresa es 41 y la física del PDF es 42.

