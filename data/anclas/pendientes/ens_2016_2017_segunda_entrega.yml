  # ---- Tamizaje: sospecha de depresión (CIDI Short Form) ----

  - id: ens_sospecha_depresion_total_2016_2017
    valor: "15,8%"
    valor_num: 15.8
    unidad: porcentaje
    metrica: "Sospecha de depresión en los últimos 12 meses (tamizaje)"
    periodo: "2016-2017"
    ambito: nacional
    definicion_textual: >-
      "Sospecha de depresión – últimos 12 meses (≥ 18 años)". Instrumento: CIDI Short
      Form, "instrumento de tamizaje de síntomas depresivos (abreviado)", 30 preguntas;
      considera disforia y anhedonia y puntúa sobre 7 criterios complementarios (criterios
      menores para depresión DSM-IV), de los que deben cumplirse al menos 5. El propio
      documento declara que el instrumento NO descarta falsos positivos por causa
      médico-física, otros diagnósticos psiquiátricos (distimia, bipolar, abuso de
      sustancias) ni duelo.
    denominador:
      descripcion: "Población de 18 años y más. El documento restringe a ≥18 para poder comparar con el diagnóstico CIDI del formulario F3."
    documento_id: ens_2016_2017_segunda_entrega
