# Anclas de evidencia — ENS 2016-2017, segunda entrega de resultados (MINSAL).
# Esquema en docs/05-CALIDAD.md#anclas-evidencia. Extraídas 2026-08-03.
#
# TODAS DURAS: MINSAL publica los resultados de su propia encuesta.
#
# DOS DEFINICIONES DISTINTAS DE DEPRESIÓN CONVIVEN EN ESTE MISMO DOCUMENTO y no son un
# conflicto, son dos cosas: "sospecha de depresión" (tamizaje CIDI Short Form, 15,8 %) y
# "depresión" (diagnóstico CIDI según criterio DSM-IV, 6,2 %). Confundirlas es el error
# más fácil de cometer con esta fuente, y circula hecho.
#
# Es un deck de presentación: las cifras van en cajas gráficas y la extracción de texto
# las devuelve sin etiqueta. Lo que se confirmó renderizando la página lleva
# `metodo_lectura: pagina_renderizada`; lo que no, va marcado requiere_verificacion_manual.

