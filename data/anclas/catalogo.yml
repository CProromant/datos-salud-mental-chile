    nota: >
      Hojeado, sin anclas. Lo que trae es prevalencia de consumo de tabaco, alcohol y
      drogas, que es factor de riesgo y no métrica de salud mental: no cumple la
      condición (c) sin forzarla. Si se quiere anclar, lo pertinente serían los
      trastornos por uso de sustancias (F10-F19), que este resumen no reporta.
      OJO: el nombre del archivo dice "enpg" (población general) pero el documento es de
      población ESCOLAR. El nombre está mal puesto, el contenido manda.

