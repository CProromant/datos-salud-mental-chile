# Anclas de evidencia — Boletines del IPC de diciembre, 2017-2025 (INE).
# Esquema en docs/05-CALIDAD.md#anclas-evidencia. Extraídas 2026-08-04.
#
# TODAS DURAS: el INE calcula y publica el IPC. No hay cadena que seguir.
#
# QUÉ SON Y QUÉ NO SON. Cada una es la variación ACUMULADA DEL AÑO, no un nivel del
# índice. Esa elección es deliberada y es lo que hace utilizable la serie: una variación
# anual no depende del año base, así que los tres cambios de base del período
# (2013=100 → 2018=100 → 2023=100) no la afectan y las nueve se encadenan sin empalmar
# nada. El «Índice General» que traen los mismos boletines sí depende de la base y por eso
# NO se captura acá.
#
# PARA QUÉ SIRVEN: son el deflactor que I-07 necesita y que bloqueaba la Fase 4 entera.
# Con la advertencia de que un ancla no es un ingestor: esto es la evidencia verificada,
# no la fuente cableada al pipeline.

version: 1
# A diferencia del resto de los archivos de este directorio, éste NO tiene un
# `documento_id` de cabecera: abarca nueve documentos distintos, uno por año. Cada ancla
# declara el suyo y apunta a su propia entrada del catálogo con su propio sha256.
documentos_id:
  [ine_ipc_boletin_dic_2017, ine_ipc_boletin_dic_2018, ine_ipc_boletin_dic_2019,
