  - id: termometro_ansiedad_moderada_severa_2023_12
    valor: "24.8%"
    valor_num: 24.8
    unidad: porcentaje
    metrica: "Proporción con síntomas de ansiedad generalizada moderada o severa"
    periodo: "2023-12"
    ambito: nacional
    definicion_textual: >-
      "Proporción con síntomas de ansiedad moderada/severa", instrumento General Anxiety
      Disorder (GAD-7). El documento declara que representa un aumento de 2.5 puntos
      respecto de abril de 2023 y que en mujeres la prevalencia es aproximadamente 2,5
      veces la de los hombres.
    denominador:
      descripcion: "Personas de 18 años y más encuestadas en la ronda 8"
    documento_id: achs_uc_termometro_r8
    sha256: "dc71738e80d63a44cfbeb8fd0be0710d048c8a929e3527e062c43cb0dbcc5349"
    pagina: 28
    ubicacion: "Lámina 'SINTOMAS DE ANSIEDAD GENERALIZADA', serie verde, punto 'Diciembre 2023'"
    fecha_consulta: "2026-08-03"
    clase: dura
    estado: verificada
    metodo_lectura: pagina_renderizada
    nota: >
      El instrumento es GAD-7, confirmado al renderizar. Cuando la cifra estaba pendiente
      se dejó anotado que "se esperaría GAD-7, pero eso es un supuesto y no se registra";
      el supuesto resultó correcto y aun así no debía escribirse antes de verlo.
      La serie de esta lámina empieza en agosto de 2021, no en julio de 2020 como las de
      depresión y GHQ: el eje muestra las tres primeras rondas vacías.
      Desglose por sexo: mujeres 34.6 %, hombres 14 %.

