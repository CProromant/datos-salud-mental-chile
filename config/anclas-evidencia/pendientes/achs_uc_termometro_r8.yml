# Anclas de evidencia — Termómetro de la Salud Mental en Chile ACHS-UC, Ronda 8.
# Esquema en docs/05-CALIDAD.md#anclas-evidencia. Extraídas 2026-08-03.
#
# DURAS pese a no ser fuente estatal: ACHS-UC levanta su propia encuesta y publica su
# propio agregado, no reprocesa a nadie. "Dura" clasifica la cadena de custodia, no la
# autoridad del emisor.
#
# NO ES COMPARABLE CON LA ENS Y NO ES UN CONFLICTO CON ELLA. Otro instrumento (PHQ-9 vs
# CIDI), otra ventana (2 semanas vs 12 meses), otro modo (telefónico vs presencial), otro
# panel. Que ambas digan "depresión" es lo único que comparten.

version: 1
documento_id: achs_uc_termometro_r8

anclas:

  - id: termometro_depresion_moderada_severa_total_2023_12
    valor: "13.1%"
    valor_num: 13.1
    unidad: porcentaje
    metrica: "Proporción con síntomas de depresión moderada o severa"
    periodo: "2023-12"
    ambito: nacional
    definicion_textual: >-
      "Proporción con síntomas de depresión moderada/severa (10+ puntos) en últimas 2
      semanas", instrumento Patient Health Questionnaire (PHQ-9). Es tamizaje de
      síntomas, no diagnóstico.
    denominador:
      descripcion: >-
        Personas de 18 años y más encuestadas en la ronda 8. Recolección telefónica entre
        el 1 y el 31 de diciembre de 2023, tasa de respuesta 70 %, sobre una muestra de
        hogares encuestada antes de manera presencial. Diseño muestral de la Universidad
        Católica. El tamaño muestral exacto de esta ronda no se pudo atribuir con certeza:
        la lámina de diseño lista ocho n sin pegarlos a su ronda.
    documento_id: achs_uc_termometro_r8
    sha256: "dc71738e80d63a44cfbeb8fd0be0710d048c8a929e3527e062c43cb0dbcc5349"
    pagina: 26
    ubicacion: "Lámina 'SÍNTOMAS DE DEPRESIÓN', serie verde, punto 'Diciembre 2023'"
    fecha_consulta: "2026-08-03"
    clase: dura
    estado: verificada
    metodo_lectura: pagina_renderizada
    nota: >
      El documento usa punto decimal ("13.1%"), no coma. Se transcribe tal cual.

