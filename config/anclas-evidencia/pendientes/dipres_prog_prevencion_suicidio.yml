  - id: dipres_razon_tasas_sexo_suicidio
    valor: "3, 4 v/s 16"
    valor_num: null
    unidad: por_100000
    metrica: "Tasas de mortalidad por suicidio por sexo (mujeres vs hombres)"
    periodo: "no declarado"
    ambito: nacional
    definicion_textual: >-
      "Se mantiene la razón de tasas de muerte por suicidio por sexo, con los hombres 4
      veces mayores que las tasas de muerte para mujeres (3, 4 v/s 16 cada 100.000
      habitantes.), en contraste con los intentos por suicidio que se observan mayormente
      en mujeres (ENS 2016-2017)".
    denominador:
      descripcion: "Población por sexo. No declarada."
    documento_id: dipres_prog_prevencion_suicidio
    sha256: "99e47f81266e21e7fb5ef83e3ffc9d26bf004bff8520ed53a5be2c46a44ff40b"
    pagina: 2
    ubicacion: "Sección de diagnóstico del problema, párrafo sobre muerte por suicidio"
    fecha_consulta: "2026-08-03"
    clase: blanda
    estado: requiere_verificacion_manual
    fuente_faltante: "Producto DEIS/MINSAL no identificado; y ENS 2016-2017 para la parte de intentos"
    metodo_lectura: texto_extraido
    nota: >
      NO SE PARSEA A NÚMERO A PROPÓSITO. El documento imprime "(3, 4 v/s 16", que puede
      ser "3,4 v/s 16" con un espacio mal puesto o ser dos valores. Además el texto dice
      que los hombres tienen tasas "4 veces mayores", y 16/3,4 ≈ 4,7 mientras 16/4 = 4:
      la aritmética interna no cierra con ninguna de las dos lecturas de forma limpia.
      Se transcribe tal cual aparece y se marca para lectura humana de la página 2.
      El período tampoco está declarado en la frase.
