  - id: who_aims_ii_chile_2014
    titulo: "Informe WHO-AIMS sobre el Sistema de Salud Mental en Chile (segundo informe)"
    editor: "Ministerio de Salud de Chile / OMS"
    anio_publicacion: 2014
    url: "https://diprece.minsal.cl/wrdprss_minsal/wp-content/uploads/2016/02/Ministerio-de-Salud_2014_Informe-WHO-AIMS-II.pdf"
