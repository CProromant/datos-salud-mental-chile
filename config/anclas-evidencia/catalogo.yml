    bytes: 1957677
    paginas: 109
    fecha_descarga: "2026-08-03"
    leido: parcial
    clase_predominante: dura
    nota: >
      Extraída solo la sección de financiamiento (figuras 1.2 y 1.3): la serie 1990-2012
      del porcentaje del presupuesto público de salud destinado a salud mental, y su
      distribución interna en 2012. Es material directo de I-07.
      QUEDA SIN EXTRAER su sección de recursos humanos, que es densa y exige cuidado con
      los denominadores: en dos páginas contiguas conviven tasas "por 100.000
      beneficiarios FONASA" y "por 100.000 habitantes" sin que el texto siempre lo diga,
      y da valores de psicólogos de 17,1 y de 171,5 que no pueden ser la misma cosa.
      Extraer eso sin resolver las unidades produciría anclas falsas con formato correcto.
      OJO: la numeración impresa va una página por detrás de la física.

