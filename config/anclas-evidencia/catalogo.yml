  - id: ens_2016_2017_informe_final
    titulo: "Encuesta Nacional de Salud 2016-2017. Informe final (Producto N° 4)"
    editor: "Ministerio de Salud de Chile, Departamento de Epidemiología"
    anio_publicacion: 2017
    url: "https://epi.minsal.cl/wp-content/uploads/2021/01/ENS_2016_2017_Informe_final_V4.3.pdf"
    sha256: "8e87d313d2079d9a798b3a43b2285c821780853e68dd7062f6c31706ef319d94"
    bytes: 4436404
    paginas: 351
    fecha_descarga: "2026-08-03"
    leido: revisado
    nota: >
      REVISADO Y DESCARTADO COMO FUENTE DE SALUD MENTAL. La nota anterior de este catálogo
      decía que era "la fuente definitiva de la ENS" y que "debería reemplazar o confirmar
      las anclas tomadas de la segunda entrega". Estaba equivocada y queda escrita para no
      repetirla.
      Es el informe METODOLÓGICO del contrato —"Producto N° 4", fechado el 14 de septiembre
      de 2017, anterior a la entrega de resultados de enero de 2018—: diseño muestral,
      factores de expansión, trabajo de terreno, control de calidad. Trae 753 líneas con
      porcentajes, ninguna de salud mental, y solo 12 menciones de "depresión" en 351
      páginas, todas narrativas.
      Consecuencia: las anclas de la ENS siguen apoyadas en la segunda entrega, que es un
      deck de presentación, y no hay en este catálogo una fuente más sólida para
      reemplazarlas. Si existe un informe de resultados propiamente tal, no se encontró.

