    leido: hojeado
    nota: >
      Hojeado, sin anclas. Lo que trae es prevalencia de consumo de tabaco, alcohol y
      drogas, que es factor de riesgo y no métrica de salud mental: no cumple la
      condición (c) sin forzarla. Si se quiere anclar, lo pertinente serían los
      trastornos por uso de sustancias (F10-F19), que este resumen no reporta.
      OJO: el nombre del archivo dice "enpg" (población general) pero el documento es de
      población ESCOLAR. El nombre está mal puesto, el contenido manda.

  - id: minsal_construyendo_salud_mental_2024
    titulo: "Construyendo Salud Mental"
    editor: "Ministerio de Salud de Chile, DIPRECE"
    anio_publicacion: 2024
    url: "https://diprece.minsal.cl/wp-content/uploads/2024/05/2024.05.28_CONSTRUYENDO-SALUD-MENTAL.pdf"
    sha256: "4c9e91103587adda84a4aab5985338e69bc9d60030ac706e5360126dcb23de8d"
    bytes: 792869
    paginas: 78
    fecha_descarga: "2026-08-03"
    leido: revisado
    clase_predominante: blanda
    nota: >
      REVISADO, CERO ANCLAS, Y ES EL RESULTADO CORRECTO. Todas sus figuras dicen
      "Elaboración propia en base a…". Es blanda de principio a fin: por la regla de
      cadena de custodia, ninguna de sus cifras se ancla acá, todas se anclan aguas
      arriba.
      Su valor real es el mapa de fuentes primarias al que apunta, varias de las cuales
      este proyecto todavía no tiene:
        - Tablero de Salud Mental del DEIS (revisado a diciembre de 2022)
        - Reporte de Mortalidad por Suicidio, Oficina de Vigilancia de ENT
        - Registro de Atenciones diarias de Urgencia, DEIS-MINSAL
        - Visor Ciudadano de Tiempos de Espera, MINSAL
        - Superintendencia de Salud, 2022
        - SENDA, Décimo Cuarto Estudio en Población General, 2020
        - OECD Health Statistics 2023
      Perseguir esas siete es más productivo que extraer de este documento.

