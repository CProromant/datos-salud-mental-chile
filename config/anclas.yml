# Anclas de reconciliación. Cifras oficiales publicadas contra las que el pipeline se
# compara antes de dejar publicar nada.
#
# La regla es de CLAUDE.md §7 y no es negociable: si un total calculado no cuadra con su
# ancla dentro de la tolerancia, NO SE PUBLICA. Sin esto el pipeline puede estar
# perfectamente ordenado y perfectamente equivocado.
#
# Un ancla sin procedencia no es un ancla, es un número inventado con más pasos. Cada una
# declara de dónde salió, en qué página, y cuándo se leyó. Si no se puede llenar
# `referencia`, el ancla no entra acá.
#
# TRAMPA (A-005): un ancla es tan buena como su definición temporal. La serie «Defunciones
# por Semana Epidemiológica» del propio DEIS NO sirve, porque está en año epidemiológico y
# 2014 y 2020 tienen 53 semanas. Dos productos del mismo organismo pueden no ser
# comparables entre sí.

version: 1

anclas:

  - id: defunciones_totales_2023
    descripcion: "Defunciones totales, todas las causas, año calendario 2023"
    source_id: deis_defunciones
    metrica:
      tipo: conteo_filas
    filtro:
      anio: 2023
    valor: 122218
    unidad: personas
    tolerancia_relativa: 0.005
    fuente_ancla: ine_vitales_anuario
    referencia: "Anuario de Estadísticas Vitales 2023 (INE), p.38, cifra de titular"
    fecha_verificacion: "2026-07-27"
    nota: >
      NO usar la Tabla 3 (p.45): dice 122.217 porque desagrega por grupo de edad y deja
      fuera un registro sin edad. Tampoco la suma por sexo (63.710 + 58.495 = 122.205),
      que omite 12 registros de sexo no asignado. La cifra comparable es la de titular.
      La reconciliación observada fue EXACTA a la unidad, no dentro de tolerancia.

  - id: defunciones_totales_2020
    descripcion: "Defunciones totales, todas las causas, año calendario 2020"
    source_id: deis_defunciones
    metrica:
      tipo: conteo_filas
    filtro:
      anio: 2020
    valor: 126169
    unidad: personas
    tolerancia_relativa: 0.005
    fuente_ancla: ine_vitales_anuario
    referencia: "Anuario de Estadísticas Vitales 2023 (INE), p.38, cifra de titular"
    fecha_verificacion: "2026-07-27"
    nota: >
      2020 es uno de los dos años de 53 semanas epidemiológicas del período (el otro es
      2014). Es justamente el año donde la serie semanal difería −1,23 %: contra el anuario
      en año calendario la reconciliación es exacta.

  - id: causas_externas_hombres_2023
    descripcion: "Defunciones masculinas por causas externas (CIE-10 cap. XX), 2023"
    source_id: deis_defunciones
    metrica:
      tipo: conteo_filas
    filtro:
      anio: 2023
      sexo: hombre
    filtro_prefijo:
      causa_cie10: [V, W, X, Y]
    valor: 6180
    unidad: personas
    tolerancia_relativa: 0.01
    fuente_ancla: ine_vitales_anuario
    referencia: "Anuario de Estadísticas Vitales 2023 (INE), Gráfico 28 p.49: 9,7 % de las defunciones masculinas"
    fecha_verificacion: "2026-07-27"
    nota: >
      LO QUE ESTA ANCLA PROTEGE: es la única que toca la derivación de `causa_cie10`, y
      habría hecho fallar A-004 de forma imposible de ignorar. Si el ingestor volviera a
      leer solo DIAG1, las causas externas caerían a casi cero —la naturaleza de la lesión
      se codifica en el capítulo XIX (S,T), no en el XX— y esta ancla lo gritaría. Sin ella,
      un suicidio mal derivado solo se nota si alguien mira el número de suicidios.
      POR QUÉ LA TOLERANCIA ES 1 % Y NO 0,5 %: el anuario publica un porcentaje redondeado
      a una décima, no un conteo. «9,7 %» significa [9,65 %, 9,75 %], que sobre 63.710
      hombres es la banda [6.148, 6.212]: ±0,5 % de puro redondeo, que ya consumiría toda
      la tolerancia habitual. El 1 % deja margen para el redondeo y sigue siendo estrecho.
      La imprecisión es de la publicación, no de los datos.
      Observado al declararla: 6.204 (9,74 %), dentro de la banda.
      El denominador del porcentaje es 63.710 según el anuario, mientras el archivo trae
      63.711 hombres. La diferencia es del anuario: su desglose por sexo sale de la Tabla 3
      (p.45), que suma 122.217 porque excluye un registro sin edad. Nuestro desglose cierra
      exacto: 63.711 + 58.495 + 12 indeterminados = 122.218.

  - id: poblacion_nacional_2020
    descripcion: "Población nacional proyectada a junio de 2020, base 2017"
    source_id: ine_proyecciones
    metrica:
      tipo: suma_columna
      columna: poblacion
    filtro:
      anio: 2020
    valor: 19458310
    unidad: personas
    tolerancia_relativa: 0.0001
    fuente_ancla: ine_proyecciones
    referencia: "INE, Estimaciones y proyecciones 2002-2035 base 2017, total país"
    fecha_verificacion: "2026-07-27"
    nota: >
      Valida el denominador, no el numerador. Un error acá desplaza TODAS las tasas del
      proyecto a la vez y en la misma dirección, que es la clase de error que no se nota
      mirando el resultado. La tolerancia es más estricta que la de los numeradores porque
      esta cifra sale de sumar el mismo archivo: cualquier desvío es un defecto de lectura,
      no una diferencia metodológica entre organismos.

