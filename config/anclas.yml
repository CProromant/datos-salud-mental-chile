# Anclas de reconciliación. Cifras oficiales publicadas contra las que el pipeline se
# compara antes de dejar publicar nada.
#
# La regla es de CLAUDE.md §7 y no es negociable: si un total calculado no cuadra con su
# ancla dentro de la tolerancia, NO SE PUBLICA. Sin esto el pipeline puede estar
# perfectamente ordenado y perfectamente equivocado.
#
# Un ancla sin procedencia no es un ancla, es un número inventado con más pasos. Cada una
# declara de dónde salió, en qué página, y cuándo se leyó. Si no se puede llenar
# `referencia`, el ancla no entra acá.
#
# TRAMPA (A-005): un ancla es tan buena como su definición temporal. La serie «Defunciones
# por Semana Epidemiológica» del propio DEIS NO sirve, porque está en año epidemiológico y
# 2014 y 2020 tienen 53 semanas. Dos productos del mismo organismo pueden no ser
# comparables entre sí.

version: 1

anclas:

  - id: defunciones_totales_2023
    descripcion: "Defunciones totales, todas las causas, año calendario 2023"
    source_id: deis_defunciones
    metrica:
      tipo: conteo_filas
    filtro:
      anio: 2023
    valor: 122218
    unidad: personas
    tolerancia_relativa: 0.005
    fuente_ancla: ine_vitales_anuario
    referencia: "Anuario de Estadísticas Vitales 2023 (INE), p.38, cifra de titular"
    fecha_verificacion: "2026-07-27"
    nota: >
      NO usar la Tabla 3 (p.45): dice 122.217 porque desagrega por grupo de edad y deja
      fuera un registro sin edad. Tampoco la suma por sexo (63.710 + 58.495 = 122.205),
      que omite 12 registros de sexo no asignado. La cifra comparable es la de titular.
      La reconciliación observada fue EXACTA a la unidad, no dentro de tolerancia.

