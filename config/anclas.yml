    valor: 19458310
    unidad: personas
    tolerancia_relativa: 0.0001
    fuente_ancla: ine_proyecciones
    referencia: "INE, Estimaciones y proyecciones 2002-2035 base 2017, total país"
    fecha_verificacion: "2026-07-27"
    nota: >
      Valida el denominador, no el numerador. Un error acá desplaza TODAS las tasas del
      proyecto a la vez y en la misma dirección, que es la clase de error que no se nota
      mirando el resultado. La tolerancia es más estricta que la de los numeradores porque
      esta cifra sale de sumar el mismo archivo: cualquier desvío es un defecto de lectura,
      no una diferencia metodológica entre organismos.

