  - id: rem_salud_mental
    nombre: "Resúmenes Estadísticos Mensuales, secciones de salud mental"
    organismo: "DEIS / MINSAL"
    dominio: "repositoriodeis.minsal.cl"
    url_indice: "https://repositoriodeis.minsal.cl/"
    # Un archivo por año, 2009 a 2025, todos respondiendo el 2026-07-27.
    url_archivo: "https://repositoriodeis.minsal.cl/DatosAbiertos/REM/SERIE_REM_2023.zip"
    patron_url_anual: "https://repositoriodeis.minsal.cl/DatosAbiertos/REM/SERIE_REM_{anio}.zip"
    anios_disponibles: "2009-2025"
    anios_legibles: "2010-2011, 2014-2025"
    manual_serie_a: "https://repositoriodeis.minsal.cl/ContenidoSitioWeb2020/REM/2025/SERIE/Manual%20Series%20REM%202025%20-2026%20SERIE%20A%20-BS-BM-%20DV1.2.pdf"
    manual_serie_p: "https://repositoriodeis.minsal.cl/ContenidoSitioWeb2020/REM/2025/SERIE/MANUAL_REM_P_2025_Version_1.2.pdf"
    seccion_salud_mental: "REM-P6"
    origen_url: verificada_en_sesion
    fecha_origen_url: "2026-07-27"
    estado: verificada
    fecha_verificacion: "2026-07-27"
    source_version: "SERIE_REM 2023 (Serie P, sección P6)"
    licencia: sin_declarar
    licencia_investigada: "2026-07-27"
    formato: [txt, xlsm, pdf_manual]
    granularidad: establecimiento_mes
    periodicidad: mensual
    prioridad: 1
    fase: 2
    depende_de: [deis_establecimientos]
    mapeo_secciones: "config/rem_secciones.yml"
    notas: >
      VERIFICADA el 2026-07-27: no solo respondió el servidor, se abrió el archivo, se
      construyó el mapeo columna->concepto y se leyó de punta a punta. Sobre 2023:
      1.004.789 personas bajo control en el programa de salud mental, 117.121 con
      depresión moderada, en 327 comunas.
      ESTRUCTURA (verificada 2026-07-27 sobre SERIE_REM_2023.zip): cada ZIP pesa ~220 MB y
      trae cinco series —A, BM, BS, D, P— más sus diccionarios. Solo 2023 son 2 GB
      descomprimidos; SerieBS2023.txt pesa 1,2 GB por sí solo.
      TRAMPA MAYOR: las columnas del archivo son GENÉRICAS. El encabezado es
      `Mes;IdServicio;Ano;IdEstablecimiento;CodigoPrestacion;IdRegion;IdComuna;Col01..Col38`
      y el significado de cada `ColNN` depende del `CodigoPrestacion` de esa fila. Sin el
      diccionario, un `Col17 = 1` no quiere decir nada.
      El diccionario NO es una tabla de consulta: es una réplica en Excel del formulario en
      papel, con celdas combinadas y encabezados de dos niveles, una hoja por sección.
      Salud mental es la sección REM-P6 en todos los años legibles. Ver los tres bloques
      comparables y los dos quiebres estructurales en docs/05-CALIDAD.md#quiebres-rem.
      Los diccionarios de 2009 y 2012 están encriptados con contraseña y el de 2013 pesa
      0 bytes: esos años son ilegibles aunque los datos estén publicados.
      Las secciones se renumeran entre manuales anuales. Mapear por nombre normalizado,
      nunca por número. Serie A (actividad) y Serie P (población en control) tienen
      periodicidad distinta: no mezclar.
      Para inspeccionar sin descargar 220 MB por año, usar `io.listar_zip_remoto` y
      `io.extraer_de_zip_remoto`.

  - id: deis_establecimientos
    nombre: "Maestro de establecimientos de salud"
    organismo: "DEIS / MINSAL"
    dominio: "datos.gob.cl"
    url_indice: "https://datos.gob.cl/dataset/establecimientos-de-salud-vigentes"
    url_archivo: "https://datos.gob.cl/dataset/3bf4cf7c-f638-4735-9a01-f65faae4beca/resource/2c44d782-3365-44e3-aefb-2c8b8363a1bc/download/establecimientos_20260721.csv"
    nombre_local: "establecimientos_20260721.csv"
    origen_url: verificada_en_sesion
    fecha_verificacion: "2026-07-29"
    estado: verificada
    # SIN `sha256` A PROPÓSITO, y no es un descuido. El archivo se genera en vivo: dos
    # descargas separadas por minutos el 2026-07-29 dieron hashes distintos, 5.707 vs 5.717
    # establecimientos y 1.996 filas con el nivel de atención reescrito. Fijar un hash acá
    # haría fallar toda ingesta futura con un mensaje que culpa a una corrupción inexistente.
    # Lo que sí se verifica: el contrato de columnas y las glosas conocidas, en el ingestor.
    # Ver docs/05-CALIDAD.md#a-016.
    verificacion: "contrato de esquema; el hash no aplica (archivo regenerado en vivo)"
    source_version: "corte continuo; consultado 2026-07-29"
    formato: csv
    granularidad: establecimiento
    unidad_territorial: comuna
    periodicidad: continua
    # La ÚNICA fuente del proyecto con licencia libre declarada. El portal la publica como
    # Creative Commons CCZero, sin restricción de uso ni obligación de atribución.
    licencia: cc0
    prioridad: 1
    fase: 2
    variables_esperadas:
      [establecimiento_deis, comuna_cut_fuente, dependencia, nivel_atencion,
       sistema_salud, vigente]
    notas: >-
      Responde quién administra la APS de cada comuna, que es de lo que depende que un
      denominador de cobertura signifique algo. Medido sobre el corte del 2026-07-21: de
      344 comunas con APS pública, 204 la tienen enteramente municipal, 120 son mixtas y
      20 no tienen ningún establecimiento municipal (Tocopilla, Andacollo, Isla de Pascua,
      Llaillay, Hualaihué, Coyhaique, Aisén y otras). Esas 20 coinciden con las que SINIM
      marca «Sin Servicio»: dos fuentes independientes sobre las mismas comunas.
      TRAMPAS, verificadas sobre el archivo completo:
      (1) Dos columnas de código. `EstablecimientoCodigo` es la vigente y calza con las
      1.889 del padrón de FONASA; `EstablecimientoCodigoAntiguo` usa otro formato
      (`03-216`) y da CERO coincidencias. Elegir por orden de aparición toma la mala.
      (2) El nivel de atención tenía dos grafías simultáneas: «Primer Nivel» y «Primario»,
      «Secundario» y «Segundo Nivel», «Terciario» y «Tercer Nivel». El 2026-07-29 DEIS las
      unificó **entre dos descargas nuestras**, así que el archivo de hoy trae una sola. El
      ingestor sigue aceptando ambas: una copia bajada antes de ese día trae las viejas, y
      filtrar por una sola grafía perdía el 18 % de la APS. Ver A-016.
      (3) `EstadoFuncionamiento` cambia de caja: «Vigente en Operación Habitual» (5.086) y
      «Vigente en operación habitual» (209). Comparar exacto descarta 209 vigentes.
      (4) Es UTF-8. Leerlo como latin-1 no falla, produce `OperaciÃ³n`, y esos
      establecimientos desaparecen silenciosamente de cualquier filtro.
      (5) Es un CORTE ACTUAL sin vigencias. Aplicarlo a años pasados atribuye al pasado la
      organización de hoy; para una serie hay que reconstruir vigencias con `fecha_inicio`
      y `fecha_cierre`, que todavía no se hace.

  - id: glosa06
    nombre: "Lista de espera No GES y garantías GES retrasadas (Glosa 06, Partida 16)"
    organismo: "MINSAL, Subsecretaría de Redes Asistenciales"
    dominio: "minsal.cl"
    url_indice: "https://www.minsal.cl/eje-tiempos-de-espera/"
    ejemplos_url_observados:
      - "https://www.minsal.cl/wp-content/uploads/2025/11/1764018133827_Glosa-06-LE-III-trimestre-2025.pdf"
      - "https://www.minsal.cl/wp-content/uploads/2026/07/Glosa-06-letra-a-b-c-i-j-k-comun-a-la-partida-1er-trimestre-1.pdf"
    origen_url: busqueda_web
    fecha_origen_url: "2026-07-26"
    estado: no_verificada
    formato: pdf
    granularidad: servicio_salud_trimestre
    periodicidad: trimestral
    prioridad: 1
    fase: 3
    estrategia: "scrapear el índice; NO construir URLs por patrón (los nombres de archivo varían)"
    fecha_verificacion: "2026-07-29"
    estado: verificada
    formato: pdf
    granularidad: especialidad_trimestre
    unidad_territorial: nacional
    licencia: sin_declarar
    variables_esperadas: [periodo, especialidad_fuente, especialidad_norm, registros]
    notas: >-
      VERIFICADA el 2026-07-29 sobre dos informes reales (III trim 2025 y I trim 2026):
      se abrieron, se extrajo el texto y se ubicó la cifra de psiquiatría.
      Casos != personas. La espera se cuenta desde la emisión de la interconsulta.
      ES TEXTO, NO ESCANEO: 55-56 páginas producidas desde Word; PyMuPDF extrae limpio y
      detecta 40-76 tablas. No hace falta OCR.
      LO QUE SÍ TRAE: la Tabla 15 desglosa registros por especialidad, con
      «PSIQUIATRÍA ADULTO» 22.963 y «PSIQUIATRÍA PEDIÁTRICA Y DE LA ADOLESCENCIA» 13.960
      al 30-09-2025; 23.134 y 12.585 al 31-03-2026.
      LO QUE NO TRAE, y es el límite de la fase: el desglose por especialidad **nunca**
      incluye días de espera. Verificado en los dos informes: ninguna página contiene a la
      vez una especialidad y la palabra «mediana». Las medianas están en la Tabla 12, por
      Servicio de Salud y con todas las especialidades sumadas. Las dos dimensiones no se
      cruzan en ninguna parte, pese a que la letra b) de la propia glosa exige «una tabla
      desglosada por cada una de las especialidades, que incluya (…) el promedio y la
      mediana de días de espera».
      TRAMPA 1: la etiqueta de la especialidad cambia de caja y de género entre informes
      («PSIQUIATRÍA ADULTO» / «Psiquiatría adulta»). Es A-012 otra vez: agrupar por la
      llave normalizada, nunca por la cadena cruda.
      TRAMPA 2: el orden de la tabla cambia —alfabético en 2025, por magnitud en 2026—,
      así que anclar en la posición de la fila rompe al primer informe nuevo.
      PENDIENTE: el informe declara en su letra I) que el detalle por establecimiento va en
      «archivos digitales complementarios» que NO están enlazados en el sitio. Conseguirlos
      por Transparencia es lo único que permitiría cruzar especialidad con territorio.

  - id: listaespera_minsal
    nombre: "Visualizador de listas de espera de salud (series trimestrales)"
    organismo: "MINSAL, Subsecretaría de Redes Asistenciales"
    dominio: "listaesperasalud.cl"
