# Catálogo de fuentes. Fuente de verdad del pipeline.
# Ver docs/01-FUENTES.md para las fichas narrativas y las trampas de cada fuente.
#
# estado:
#   no_verificada  -> la URL NO fue comprobada con una descarga real. El pipeline se niega
#                     a ingerirla salvo con --permitir-no-verificada (solo desarrollo).
#   verificada     -> comprobada con `obsm sources verify`; requiere fecha_verificacion.
#   rota           -> antes verificada, ahora falla. Requiere issue abierto.
#
# origen_url:
#   busqueda_web   -> la URL apareció textualmente en una búsqueda web (fecha en el campo).
#   por_confirmar  -> se sabe que el organismo publica esto; la URL exacta NO está confirmada.
#
# NUNCA promover a `verificada` sin una comprobación real. Ver CLAUDE.md §2.1.

version: 1
actualizado: "2026-07-26"

defaults:
  timeout_s: 60
  reintentos: 3
  user_agent: "obsm/0.1 (observatorio de salud mental; contacto pendiente)"

fuentes:

  - id: deis_defunciones
    nombre: "Defunciones con causa básica CIE-10"
    organismo: "DEIS / MINSAL"
    dominio: "deis.minsal.cl"
    url_indice: "https://deis.minsal.cl/#datosabiertos"
    url_archivo: "https://repositoriodeis.minsal.cl/DatosAbiertos/VITALES/DEFUNCIONES_FUENTE_DEIS_1990_2023_CIFRAS_OFICIALES.zip"
    url_archivo_preliminar: "https://repositoriodeis.minsal.cl/DatosAbiertos/VITALES/DEFUNCIONES_FUENTE_DEIS_2024_2026_01072026.zip"
    url_espejo: "https://datos.gob.cl/organization/ministerio_de_salud"
    origen_url: busqueda_web
    fecha_origen_url: "2026-07-26"
    estado: verificada
    fecha_verificacion: "2026-07-27"
    # `sha256` es el del ZIP publicado, que es lo que se descarga y lo que el organismo
    # puede volver a servir. El manifiesto de bronze registra el hash del CSV extraído,
    # que es otro archivo. Sin anotar el miembro y su hash acá, las dos puntas no se
    # conectan y bronze no es trazable al artefacto publicado.
    sha256: "311b56533a60cc5b554575de3cec6575063aa1a1ce17d25c6017a2895cdd60e7"
    archivo_extraido: "DEFUNCIONES_FUENTE_DEIS_1990_2023_CIFRAS_OFICIALES.csv"
    sha256_extraido: "b763f5be857edbef5d06dc2da9437d7be8640f76719b5a0bb75b276282553ebb"
    bytes_extraido: 869415741
    source_version: "CIFRAS_OFICIALES 1990-2023 (preliminar 2024-2026 al 01-07-2026)"
    formato: csv
    granularidad: registro_individual
    unidad_territorial: comuna_residencia
    periodicidad: anual
    latencia_esperada_dias: 400
    anios_preliminares: 2
    licencia: por_confirmar
    prioridad: 1
    fase: 1
    variables_esperadas:
      [anio, fecha_defuncion, sexo, edad, comuna_residencia, comuna_defuncion, causa_cie10]
    ancla_reconciliacion: "total nacional de defunciones por año publicado por DEIS"
    tolerancia_reconciliacion: 0.005
    notas: >
      Usar comuna de RESIDENCIA para tasas. Y10-Y34 solo como sensibilidad.
      Prohibida la publicación desagregada por subcódigo X60-X84 (ver docs/06).
      VERIFICADO 2026-07-27 sobre el archivo real: 3.182.446 filas, 27 columnas,
      separador `;`, encoding latin-1, sin campos identificatorios.
      TRAMPA MAYOR (A-004): el suicidio NO está en DIAG1 sino en DIAG2. X60-X84 aparece
      0 veces en DIAG1 y 46.805 en DIAG2; DIAG1 trae la naturaleza de la lesión (T71X).
      Leer solo DIAG1 da cero suicidios en 27 años sin lanzar error.
      TRAMPA MAYOR (A-002): 1990-1996 está en CIE-9, no en CIE-10; el corte es limpio en
      1997 y los agrupadores de cie10.py sobre esos años también devuelven cero. Además
      no se sabe cómo se codifica el suicidio en ese período: E95x aparece 0 veces.
      La serie de suicidio no puede empezar antes de 1997.
      COD_COMUNA viene sin el cero a la izquierda en las regiones 01-09 (A-003); es la
      comuna de RESIDENCIA, que es la correcta para tasas.
      El diccionario que viene en el ZIP describe bien la semántica pero sus nombres de
      columna NO corresponden a los del CSV: dice ANO_DEF donde el archivo trae AÑO.
      El nombre del archivo preliminar rota con cada publicación; el índice se arma por
      JavaScript, así que la URL no se puede raspar del HTML. El servidor responde 403
      sin user-agent de navegador y 404 a las peticiones HEAD.

