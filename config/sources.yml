    # Un JSON por Servicio de Salud, más `data_NACIONAL.json`. Sin sesión ni token.
    # El nombre del archivo es el del servicio en mayúsculas, sin tildes y con `_`.
    patron_url: "https://www.listaesperasalud.cl/data/data_{SERVICIO}.json"
    origen_url: verificada_en_sesion
    fecha_verificacion: "2026-07-29"
    estado: verificada
    formato: json
    granularidad: servicio_salud_trimestre
    unidad_territorial: servicio_salud
    periodicidad: trimestral
    cobertura_temporal: "2019-03 a 2025-06"
    licencia: sin_declarar
    prioridad: 1
    fase: 3
    variables_esperadas:
      [servicio, trimestre, consulta_registros, consulta_pacientes, consulta_promedio,
       consulta_mediana, quirurgica_registros, quirurgica_pacientes, quirurgica_promedio,
       quirurgica_mediana, ges_registros, ges_pacientes, ges_promedio, ges_mediana]
    notas: >-
      VERIFICADA el 2026-07-29 bajando los 29 servicios más el nacional: 780 filas,
      30 series, 26 trimestres. Es la fuente que tiene la dimensión que al PDF de la
      Glosa 06 le falta —mediana de días por Servicio de Salud— y le falta la que el PDF
      sí tiene. Son complementarias y **ninguna las cruza**.
      QUÉ TRAE: tres listas (consulta nueva de especialidad, intervención quirúrgica,
      garantías GES retrasadas) × cuatro métricas (registros, pacientes, promedio y mediana
      de días). Nacional al 2025-06: 2.699.409 registros en espera de consulta de
      especialidad, mediana 264 días.
      QUÉ NO TRAE: **especialidad**. Las claves agregan todas las especialidades, así que
      no permite aislar psiquiatría. Para eso hay que ir al PDF (`glosa06`).
      TRAMPA 1 — la mediana no existe antes de 2022. Cobertura por año: 0 % en 2019-2021,
      50 % en 2022, 100 % desde 2023. Toda serie de medianas empieza en 2022, y una
      tendencia que arranque antes está comparando contra vacío.
      TRAMPA 2 — `ges_pacientes` está en el 3 % de las celdas y `ges_mediana` cae al 3 % en
      2025. La lista GES es la peor cubierta de las tres.
      TRAMPA 3 — el nombre de archivo de O'Higgins lleva **apóstrofo tipográfico** (U+2019),
      no el recto. `data_SERVICIO_DE_SALUD_O’HIGGINS.json` responde 200 y con `'` da 404.
      Es la misma familia de trampas que `territorio.ALIAS` ya cubre para los nombres de
      comuna, ahora en una ruta HTTP.
      SIN sha256: los archivos se actualizan cada trimestre.

  - id: ges_decreto
    nombre: "Decreto GES vigente y garantías de oportunidad"
    organismo: "MINSAL / Superintendencia de Salud"
    dominio: "minsal.cl"
    # Tenía ficha en docs/01-FUENTES.md (C2) desde Fase 0 y NO estaba en el catálogo, que es
    # la fuente de verdad (CLAUDE.md §3). Se agrega para cerrar el hueco, sin URL: ninguna
