    notas: >
      Maestro territorial del que deriva config/territorio_comunas.csv. Trae los CUT como
      texto con ceros a la izquierda. Es POSTERIOR a la creación de Ñuble (2018), lo que
      importa: las capas cartográficas que circulan como "DPA" suelen arrastrar la
      codificación anterior a 2007 (sin Los Ríos, Arica y Parinacota ni Ñuble) y producen
      joins vacíos sin error visible. Control de vigencia: Chillán debe ser 16101, no 8401.
      El servidor responde 403 sin user-agent de navegador.

