    # El dato lo produce FONASA al validar la población para el per cápita, pero FONASA
    # no lo publica como archivo: su portal de datos abiertos es un WordPress con un
    # plugin de gráficos, sin API ni índice de archivos (verificado 2026-07-28).
    # SINIM sí lo expone como descarga. Es la misma variable, con fuente declarada FONASA.
    # Descarga directa, sin cookie de sesión: verificada el 2026-07-28 y byte por byte
    # idéntica a la que entrega el portal con sesión iniciada.
    # Los parámetros son ids opacos de SINIM, no valores con significado propio:
    #   area[]=2            04. SALUD MUNICIPAL
    #   subarea[]=30,25     A. ANTECEDENTES GENERALES + B. COBERTURA
    #   variables[]         464 HPISM   total inscrito (el dato que se quiere)
    #                       466 HPVM6   inscritos menores de 6      \
    #                       470 HPV2064 inscritos de 20 a 64         > tramos disjuntos
    #                       471 HPVM64  inscritos mayores de 64     /
    #     Los tres tramos NO son adorno: su suma es una cota inferior del total y es lo
    #     que permite detectar que el total está roto sin recurrir a nada externo (A-015).
    #     Se bajan en la misma petición porque separarlos arriesga mezclar dos versiones.
    #   periodos[]          26=2025, 25=2024 ... 2=2001. Van unidos por coma en UN
    #                       parámetro: repetir `periodos[]` devuelve solo el primer año.
    #   regiones[]=T y municipios[]=T  todas.
    url_archivo: "https://datos.sinim.gov.cl/datos_municipales/obtener_datos_municipales.php?area%5B%5D=2&subarea%5B%5D=30%2C25&variables%5B%5D=464%2C466%2C470%2C471&periodos%5B%5D=26%2C25%2C24%2C23%2C22%2C21%2C20%2C19%2C18%2C17%2C16%2C15%2C14%2C13%2C12%2C11%2C10%2C9%2C8%2C7%2C6%2C5%2C4%2C3%2C2&regiones%5B%5D=T&municipios%5B%5D=T&corrmon=0"
    url_indice: "https://datos.sinim.gov.cl/datos_municipales.php"
    # El endpoint no tiene nombre de archivo útil; este es el que se usa en raw/ y bronze/.
    nombre_local: "sinim_poblacion_inscrita_y_tramos_2001_2025.xls"
    origen_url: verificada_en_sesion
    fecha_verificacion: "2026-07-28"
    # 1.807.616 bytes, 345 comunas x 25 años x 4 variables. Cambia cuando SINIM incorpore
    # 2026 o reciba el 2023 que falta: eso es versión nueva, no descarga corrupta.
    sha256: "30c85a5d36656c07b0d1a77a0d37bc247c64231f9a35f57ecb595eba97b9a37c"
    source_version: "SINIM 2026-07-28 (serie 2001-2025)"
    estado: verificada
    formato: spreadsheetml_2003   # se sirve como .xls pero es XML; no lo abre xlrd
    granularidad: comuna_anio
    unidad_territorial: comuna
    periodicidad: anual
    cobertura_temporal: "2001-2025"
    licencia: sin_declarar
    prioridad: 2
    fase: 2
    variables_esperadas: [comuna_cut, anio, poblacion_inscrita]
    notas: >-
      Denominador para cobertura de APS. 345 comunas x 25 años; 14.807.159 inscritos en
      2025, 73,3 % de la población proyectada por el INE.
      TRAMPAS, todas verificadas contra la descarga del 2026-07-28:
      (1) La celda trae cuatro valores no numéricos: «Costo Fijo» (comuna financiada por
      costo fijo y no por per cápita), «Sin Servicio» (la APS no la administra el
      municipio sino el Servicio de Salud), «No Recepcionado» y «No Aplica». Ninguno es
      cero y ninguno es dato faltante al azar.
      (2) Desde ~2019 SINIM dejó de escribir «Sin Servicio» y escribe 0. Son 36 comunas,
      25 de ellas en 2025 (Mejillones, Tocopilla, Andacollo, Isla de Pascua, Llaillay,
      Coinco, Graneros, Hualaihué y otras). Un 0 acá NO es cero inscritos: es que el
      denominador no existe para esa comuna. Ver docs/05-CALIDAD.md#a-013.
      (3) El año 2023 viene «No Recepcionado» en las 345 comunas: no hay dato.
      (4) Es población inscrita en APS MUNICIPAL. No cubre la APS dependiente del
      Servicio de Salud, así que no es el universo completo de la APS pública.
      (5) 118 comunas superan el 100 % de la población INE en 2025. No es error
      necesariamente: la gente se inscribe donde trabaja, y la proyección INE es base
      2017. Es otra razón para migrar a base Censo 2024.
      (6) Desde 2020, once comunas con historial «Costo Fijo» publican cifras de una o dos
      cifras sobre miles de habitantes: Quirihue declaró 9.204 inscritos en 2014 y 33 en
      2025. Como denominador comunal producen coberturas de 300 %. Se marcan con
      `denominador_implausible` y NO se borran. Ver docs/05-CALIDAD.md#a-015.

