    origen_url: por_confirmar
    estado: no_verificada
    formato: pdf
    granularidad: problema_de_salud
    unidad_territorial: nacional
    periodicidad: cuatrienal
    prioridad: 3
    fase: 5
    notas: >-
      Define qué está garantizado y con qué plazo: depresión, esquizofrenia de primer
