  - id: ine_proyecciones
    nombre: "Estimaciones y proyecciones de población por comuna, sexo y edad simple"
    organismo: "INE"
    dominio: "ine.gob.cl"
    url_indice: "https://www.ine.gob.cl/estadisticas/sociales/demografia-y-vitales/proyecciones-de-poblacion"
    url_archivo: "https://www.ine.gob.cl/docs/default-source/proyecciones-de-poblacion/cuadros-estadisticos/base-2017/ine_estimaciones-y-proyecciones-2002-2035_base-2017_comunas0381d25bc2224f51b9770a705a434b74.csv?sfvrsn=b6e930a7_3&download=true"
    url_espejo: "https://www.ine.gob.cl/docs/default-source/proyecciones-de-poblacion/cuadros-estadisticos/base-2017/estimaciones-y-proyecciones-2002-2035-comunas.xlsx"
    origen_url: verificada_en_sesion
    fecha_origen_url: "2026-07-27"
    estado: verificada
    fecha_verificacion: "2026-07-27"
    sha256: "c2a8847168b2a733410bd55e586dec67c08781f584caf3476c92ad6767a0656c"
    source_version: "base 2017 · comunas 2002-2035"
    formato: csv
    granularidad: comuna_sexo_edad_anio
    unidad_territorial: comuna
    periodicidad: irregular
    cobertura_temporal: "2002-2035"
    # Términos generales del INE, leídos el 2026-07-27 en
    # https://www.ine.gob.cl/terminos-de-uso-y-licencia-de-datos-abiertos
    # Permiten uso comercial, pero exigen ShareAlike. Como esta fuente es el denominador de
    # toda tasa, el proyecto adoptó CC BY-SA 4.0 para su capa gold (ADR 0005). Publicar gold
    # derivado de acá está habilitado; hacerlo bajo CC BY 4.0 no.
    licencia: "CC BY-SA 4.0"
    licencia_verificada: "2026-07-27"
    prioridad: 1
    fase: 1
    critico: true
    variables_esperadas:
      [region, provincia, comuna, sexo, edad, poblacion_por_anio]
    ancla_reconciliacion: "total nacional por año publicado por el INE (2020 = 19.458.310)"
    tolerancia_reconciliacion: 0.001
    notas: >
      Denominador de toda tasa del proyecto. VERIFICADO 2026-07-27 con descarga real:
      9.768.366 bytes, 56.052 filas (346 comunas x 2 sexos x 81 edades), 42 columnas,
      encoding latin-1, separador `,`. Cuadra exactamente con la DPA: 346 comunas y 16
      regiones, cero diferencias en ambas direcciones. Total nacional 2020 = 19.458.310.
      FORMATO ANCHO: una columna `Poblacion <año>` por cada año 2002-2035. Hay que pasarlo
      a formato largo antes de usarlo como denominador.
      TRAMPA: la columna `Comuna` viene como entero sin cero a la izquierda (1101, no
      "01101"), igual que COD_COMUNA en DEIS (A-003). Leer como string y aplicar zfill(5).
      Con eso el join contra la DPA es perfecto; sin eso se pierden las regiones 01-09.
      LIMITE DE COBERTURA: empieza en 2002. La serie de defunciones va de 1990 a 2023 y en
      CIE-10 desde 1997, así que NO hay denominador comunal para 1997-2001. La ventana de
      tasas comunales es 2002-2023. Ver docs/05-CALIDAD.md.
      `Edad` llega a 80 como grupo abierto (80 y más), no como edad exacta.
      RE-BASE PENDIENTE: el 2026-01-28 el INE publicó las estimaciones base Censo 2024
      (1992-2070). En esta sesión solo se pudo confirmar en vivo la presentación de
      resultados en PDF; los tabulados comunales base 2024 no se ubicaron (el listado de
      cuadros estadísticos se arma por JavaScript y no está en el HTML). Migrar de base
      recalcula TODAS las tasas retroactivamente: es un cambio versionado, no una
      actualización silenciosa. Por eso el denominador lleva su propio source_version.

