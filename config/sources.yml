  - id: ine_vitales_anuario
    nombre: "Anuario de Estadísticas Vitales (ancla de reconciliación)"
    organismo: "INE"
    dominio: "ine.gob.cl"
    url_indice: "https://www.ine.cl/estadisticas/sociales/demografia-y-vitales/nacimientos-matrimonios-y-defunciones"
    url_archivo: "https://www.ine.gob.cl/docs/default-source/nacimientos-matrimonios-y-defunciones/publicaciones-y-anuarios/anuarios-de-estad%C3%ADsticas-vitales/anuario-de-estad%C3%ADsticas-vitales-2023-nacimientos-y-defunciones.pdf?sfvrsn=63d4438_2"
    origen_url: busqueda_web
    fecha_origen_url: "2026-07-27"
    estado: verificada
    fecha_verificacion: "2026-07-27"
    sha256: "645a122f41a8a0abb7563c32275c099bc616f66cf4f4832b6e9011fa8547e54c"
    source_version: "Anuario 2023 (nacimientos y defunciones)"
    formato: pdf
    granularidad: agregado_nacional
    periodicidad: anual
    licencia: "CC BY-NC 2.0"
    # No alimenta gold: de acá solo salen dos cifras usadas para verificar el conteo propio,
    # y el documento no se redistribuye. Por eso su cláusula NC no contamina la salida
    # CC BY-SA 4.0 del proyecto (ADR 0005). Este campo es lo que hace cumplir esa distinción
    # en `tests/test_registry.py`; si alguna vez se ingiere de verdad, hay que reabrir ADR 0005.
    alimenta_gold: false
    prioridad: 1
    fase: 1
    depende_de: []
    notas: >
      No es una fuente de datos del pipeline: es el ANCLA en año calendario contra la que
      se reconcilia `deis_defunciones`. Cifras oficiales verificadas en el PDF:
      2023 = 122.218 y 2020 = 126.169 defunciones (p.38). Ambas coinciden EXACTO con el
      conteo del archivo de causas, no dentro de tolerancia.
      Ojo con la Tabla 3 (p.45): dice 122.217 porque desagrega por grupo de edad y excluye
      un registro sin edad; además 63.710 hombres + 58.495 mujeres = 122.205, y los 12
      restantes son sexo no asignado. La cifra comparable es la de titular, 122.218.
      CONTRADICCIÓN DE LICENCIA sin resolver (2026-07-27): acá figura CC BY-NC 2.0, pero los
      términos generales del sitio del INE son CC BY-SA 4.0 y permiten uso comercial. No se
      pudo determinar cuál rige para este PDF en particular. Mientras siga abierto, tratar
      la condición más restrictiva (NC) como la vigente para este documento. En la práctica
      el riesgo es bajo porque de acá solo se usan dos cifras como ancla de verificación y
      no se redistribuye el anuario; un dato aislado no es una obra. Ver LICENSE-DATA.md.

