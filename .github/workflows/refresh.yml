name: refresh
on:
  schedule:
    - cron: "0 9 * * 1"   # lunes 09:00 UTC
  workflow_dispatch:

jobs:
  verificar-fuentes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - name: Verificar que las URLs del catálogo siguen vivas
        id: verify
        run: python -m obsm.cli sources verify | tee verificacion.json
        continue-on-error: true
      - name: Abrir issue si alguna fuente cambió o cayó
        if: steps.verify.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Fuentes con problemas de acceso (${new Date().toISOString().slice(0,10)})`,
              body: 'La verificación semanal falló. Revisar el log y actualizar config/sources.yml.\n\nRecordatorio: una URL que responde 200 no está verificada hasta que alguien abre el archivo.'
            })

# Nota deliberada: este workflow NO publica. Detecta y avisa. La publicación es humana
# (ver docs/02-ARQUITECTURA.md, "Ejecución programada").
